name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # the models are faked in tests, so CI needs neither Ollama nor GLiClass
      - run: npm test
      - run: python3 -m py_compile decider/server.py
